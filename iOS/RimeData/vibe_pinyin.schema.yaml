# Vibe Voice standard Simplified Chinese full-pinyin schema.
# Dictionary source: rime/rime-pinyin-simp (Apache-2.0).

schema:
  schema_id: vibe_pinyin
  name: Vibe 拼音
  version: "0.7.0"
  author:
    - Vibe Voice OSS contributors

switches:
  - name: ascii_mode
    reset: 0
    states: [中文, 英文]

engine:
  processors:
    - ascii_composer
    - speller
    # Must follow the speller so letters still build a syllable. It turns the
    # punctuation keys into their Chinese forms; without it the keyboard could
    # only ever type half-width punctuation in Chinese mode.
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - abc_segmentor
    - fallback_segmentor
  translators:
    - script_translator

speller:
  alphabet: zyxwvutsrqponmlkjihgfedcba
  delimiter: " '"
  algebra:
    - abbrev/^([a-z]).+$/$1/
    - abbrev/^([zcs]h).+$/$1/
    - derive/^([nl])ue$/$1ve/
    - derive/^([jqxy])u/$1v/
    - derive/un$/uen/
    - derive/ui$/uei/
    - derive/iu$/iou/

# Defined inline rather than through `import_preset: default`, because this
# project ships its own minimal Rime data directory with no punctuation.yaml.
# Anything absent here falls through to librime returning the key unhandled,
# and the keyboard types the ASCII character itself.
punctuator:
  half_shape:
    "'": { pair: ["‘", "’"] }
    '"': { pair: ["“", "”"] }
    ",": "，"
    ".": "。"
    "!": "！"
    "?": "？"
    ":": "："
    ";": "；"
    "(": "（"
    ")": "）"
    "<": "《"
    ">": "》"
    "[": "【"
    "]": "】"
    "\\": "、"
    "^": "……"
    "_": "——"
    "~": "～"
    "`": "·"
    "$": "￥"

translator:
  dictionary: pinyin_simp
  enable_user_dict: true
  enable_sentence: true
  preedit_format:
    - xform/([nl])v/$1ü/
    - xform/([nl])ue/$1üe/
    - xform/([jqxy])v/$1u/
