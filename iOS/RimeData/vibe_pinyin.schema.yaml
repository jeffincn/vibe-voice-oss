# Vibe Voice standard Simplified Chinese full-pinyin schema.
# Dictionary source: rime/rime-pinyin-simp (Apache-2.0).

schema:
  schema_id: vibe_pinyin
  name: Vibe 拼音
  version: "0.7.0"
  author:
    - Vibe Voice OSS contributors

switches:
  - name: ascii_mode
    reset: 0
    states: [中文, 英文]

engine:
  processors:
    - ascii_composer
    - speller
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - abc_segmentor
    - fallback_segmentor
  translators:
    - script_translator

speller:
  alphabet: zyxwvutsrqponmlkjihgfedcba
  delimiter: " '"
  algebra:
    - abbrev/^([a-z]).+$/$1/
    - abbrev/^([zcs]h).+$/$1/
    - derive/^([nl])ue$/$1ve/
    - derive/^([jqxy])u/$1v/
    - derive/un$/uen/
    - derive/ui$/uei/
    - derive/iu$/iou/

translator:
  dictionary: pinyin_simp
  enable_user_dict: true
  enable_sentence: true
  preedit_format:
    - xform/([nl])v/$1ü/
    - xform/([nl])ue/$1üe/
    - xform/([jqxy])v/$1u/
