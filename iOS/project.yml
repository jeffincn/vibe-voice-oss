name: VibeVoiceMobile
options:
  bundleIdPrefix: app.vibevoice.oss
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: 0.7.0
    CURRENT_PROJECT_VERSION: 44
    SWIFT_VERSION: 5.0
    # Under Swift 5 these are warnings, but they are the only thing that can
    # find an actor boundary crossed by the audio capture thread.
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    # DEVELOPMENT_TEAM is deliberately unset: writing an empty string into the
    # project pins automatic signing to "no team" in the Xcode UI. Device builds
    # pass it on the xcodebuild command line instead.
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
packages:
  ArgmaxOSS:
    url: https://github.com/argmaxinc/argmax-oss-swift.git
    exactVersion: 1.0.0
targets:
  VibeVoiceMobile:
    type: application
    platform: iOS
    sources:
      - path: VibeVoiceMobile
      - path: Shared
      - path: RimeBridge
      - path: RimeData
        type: folder
        buildPhase: resources
    settings:
      base:
        # Set per target, not at the project level: XcodeGen writes its own
        # default of "1,2" into every target, which silently overrides a
        # project-level value and ships an iPad build nothing tests.
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_BUNDLE_IDENTIFIER: app.vibevoice.oss.ios
        INFOPLIST_FILE: Resources/AppInfo.plist
        CODE_SIGN_ENTITLEMENTS: Resources/VibeVoiceMobile.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: RimeBridge/VVRimeBridge.h
        OTHER_LDFLAGS: "$(inherited) -lc++"
    dependencies:
      - target: VibeVoiceKeyboard
        embed: true
      - framework: Vendor/librime.xcframework
        embed: false
      - package: ArgmaxOSS
        product: WhisperKit
  VibeVoiceKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: Keyboard
      - path: Shared
      - path: RimeBridge
      - path: RimeData
        type: folder
        buildPhase: resources
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_BUNDLE_IDENTIFIER: app.vibevoice.oss.ios.keyboard
        INFOPLIST_FILE: Resources/KeyboardInfo.plist
        CODE_SIGN_ENTITLEMENTS: Resources/VibeVoiceKeyboard.entitlements
        SKIP_INSTALL: YES
        # Fails the compile on unavailable API instead of at App Store
        # validation, which is the only other place this is checked.
        APPLICATION_EXTENSION_API_ONLY: YES
        SWIFT_OBJC_BRIDGING_HEADER: RimeBridge/VVRimeBridge.h
        OTHER_LDFLAGS: "$(inherited) -lc++"
    dependencies:
      - framework: Vendor/librime.xcframework
        embed: false
  VibeVoiceMobileTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        excludes:
          - Fixtures
      - path: Tests/Fixtures
        buildPhase: resources
    dependencies:
      - target: VibeVoiceMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.vibevoice.oss.ios.tests
        GENERATE_INFOPLIST_FILE: YES
  VibeVoiceMobileIntegrationTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: IntegrationTests
      - path: Tests/Fixtures
        buildPhase: resources
    dependencies:
      - target: VibeVoiceMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.vibevoice.oss.ios.integrationtests
        GENERATE_INFOPLIST_FILE: YES
  VibeVoiceMobileUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: VibeVoiceMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.vibevoice.oss.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  # Hermetic: no network, safe to run on every change.
  VibeVoiceMobile:
    build:
      targets:
        VibeVoiceMobile: all
        VibeVoiceKeyboard: all
        VibeVoiceMobileTests: [test]
        VibeVoiceMobileUITests: [test]
    test:
      gatherCoverageData: true
      targets:
        - VibeVoiceMobileTests
        - VibeVoiceMobileUITests
  # Downloads the real WhisperKit model. Opt in.
  VibeVoiceMobileIntegration:
    build:
      targets:
        VibeVoiceMobile: all
        VibeVoiceKeyboard: all
        VibeVoiceMobileIntegrationTests: [test]
    test:
      gatherCoverageData: false
      targets:
        - VibeVoiceMobileIntegrationTests
