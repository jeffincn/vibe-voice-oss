# Rime default settings for Vibe Type.
# Key routing / ascii_composer / key_binder / recognizer align with Squirrel's
# SharedSupport/default.yaml (https://github.com/rime/squirrel).
# encoding: utf-8

config_version: "0.8.1"

schema_list:
  - schema: vibe_pinyin
  - schema: vibe_pinyin_trad_pinyin
  - schema: vibe_zhuyin_trad

switcher:
  caption: 〔方案选单〕
  hotkeys:
    - Control+grave
    - Control+Shift+grave
    - F4
  save_options:
    - full_shape
    - ascii_punct
  fold_options: true
  abbreviate_options: true
  option_list_separator: ／

menu:
  page_size: 9

key_binder:
  bindings:
    __patch:
      - key_bindings:/emacs_editing
      - key_bindings:/paging_with_minus_equal
      - key_bindings:/paging_with_comma_period
      - key_bindings:/numbered_mode_switch

selector:
  bindings:
    ISO_Left_Tab: previous_candidate
    Shift+Tab: previous_candidate
    Tab: next_candidate

recognizer:
  patterns:
    email: "^[A-Za-z][-_.0-9A-Za-z]*@.*$"
    uppercase: "[A-Z][-_+.'0-9A-Za-z]*$"
    url: "^(www[.]|https?:|ftp[.:]|mailto:|file:).*$|^[a-z]+[.].+$"

# Squirrel defaults: left Shift → inline_ascii, right Shift → commit_text.
ascii_composer:
  good_old_caps_lock: true
  switch_key:
    Shift_L: inline_ascii
    Shift_R: commit_text
    Control_L: noop
    Control_R: noop
    Caps_Lock: clear
    Eisu_toggle: clear
